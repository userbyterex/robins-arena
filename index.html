<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Robin's Arena</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hud.css" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- ===== PANTALLA DE LOBBY ===== -->
  <div id="screen-lobby">
    <div class="lobby-container">

      <!-- Panel: Nombre -->
      <div id="panel-name" class="panel" data-active="true">
        <h1>🏹 ROBIN'S ARENA</h1>
        <p class="subtitle">fast arena deathmatch · 2–4 players · free to play</p>
        <input type="text" id="input-name" placeholder="Enter your callsign" maxlength="12" autofocus />
        <button id="btn-continue">Continue</button>
      </div>

      <!-- Panel: Elegir acción -->
      <div id="panel-choice" class="panel" data-active="false">
        <h2>Choose an action</h2>
        <div class="choice-buttons">
          <button id="btn-host">🏕️ Create Camp</button>
          <button id="btn-join-open">🔗 Join Camp</button>
        </div>
      </div>

      <!-- Panel: Unirse con código / lista de camps -->
      <div id="panel-join" class="panel" data-active="false">
        <h2>Join a camp</h2>
        <button id="btn-refresh-camps" class="refresh-btn">↻ Open camps</button>
        <ul id="camp-list">
          <li class="camp-list-empty">Scanning for camps…</li>
        </ul>
        <p class="or-divider">— or enter a code —</p>
        <input type="text" id="input-code" placeholder="4-letter code" maxlength="4" autocomplete="off" />
        <button id="btn-join-confirm">Join with code</button>
        <button id="btn-join-back" class="back-btn">← back</button>
      </div>

      <!-- Panel: Lobby (sala) -->
      <div id="panel-lobby" class="panel" data-active="false">
        <h2>🏕️ Camp lobby</h2>
        <p>Code: <strong id="room-code-display">----</strong></p>
        <p id="lobby-status">Waiting for players…</p>
        <ul id="player-roster"></ul>
        <button id="btn-start-game" hidden>⚔️ Start Match</button>
        <button id="btn-lobby-back" class="back-btn">← leave</button>
      </div>

    </div>
  </div>

  <!-- ===== PANTALLA DE JUEGO ===== -->
  <div id="screen-game" hidden>
    <canvas id="game-canvas"></canvas>
    <div id="weapon-bar"></div>
  </div>

  <!-- ===== SCRIPTS DEL JUEGO (orden necesario) ===== -->
  <script src="js/engine/camera.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/engine/map.js"></script>
  <script src="js/engine/touch-controls.js"></script>

  <script src="js/entities/weapons.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/entities/projectile.js"></script>

  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/host-sim.js"></script>
  <script src="js/client-sync.js"></script>
  <script src="js/network.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/ui-weapon-bar.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
