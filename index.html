<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Robin's Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<!-- ==================== LOBBY SCREEN ==================== -->
<div id="lobby-screen">
  <div class="lobby-container">

    <h1>🏹 ROBIN'S ARENA</h1>
    <p class="subtitle">Camp vs Castle · classes · conquest</p>

    <!-- Name Input -->
    <div class="name-row">
      <input type="text" id="player-name" placeholder="Your callsign" maxlength="12" value="Robin" aria-label="Player callsign" autocomplete="off" autofocus />
    </div>

    <!-- Class Selection -->
    <div class="section-title">Choose your class</div>
    <div class="class-grid">
      <div class="class-card selected" data-class="warrior" tabindex="0" role="button" aria-pressed="true">
        <div class="class-icon">⚔️</div>
        <div class="class-name">Warrior</div>
        <div class="class-tag">Tank · Charge</div>
        <div class="class-ult">Shield Bash</div>
      </div>
      <div class="class-card" data-class="ranger" tabindex="0" role="button" aria-pressed="false">
        <div class="class-icon">🏹</div>
        <div class="class-name">Ranger</div>
        <div class="class-tag">Marksman · Volley</div>
        <div class="class-ult">Arrow Volley</div>
      </div>
      <div class="class-card" data-class="mage" tabindex="0" role="button" aria-pressed="false">
        <div class="class-icon">🔮</div>
        <div class="class-name">Mage</div>
        <div class="class-tag">Glass · Nova</div>
        <div class="class-ult">Arcane Nova</div>
      </div>
      <div class="class-card" data-class="monk" tabindex="0" role="button" aria-pressed="false">
        <div class="class-icon">🥋</div>
        <div class="class-name">Monk</div>
        <div class="class-tag">Agile · Heal</div>
        <div class="class-ult">Spirit Restore</div>
      </div>
    </div>

    <!-- Character Creator -->
    <div class="creator-panel">
      <div class="creator-colors">
        <div class="color-row" id="skin-row"><label>Skin</label></div>
        <div class="color-row" id="hair-row"><label>Hair</label></div>
        <div class="color-row" id="cloth-row"><label>Cloth</label></div>
      </div>
      <div class="preview-box" id="char-preview"></div>
    </div>

    <!-- Action Buttons -->
    <div class="button-row lobby-actions">
      <button id="btn-solo" class="btn-primary">⚔️ Solo Hunt</button>
      <button id="btn-host" class="btn-primary">🏕️ Host Camp</button>
      <button id="btn-join" class="btn-secondary">🔗 Join Camp</button>
    </div>

  </div>
</div>

<!-- ==================== GAME SCREEN ==================== -->
<div id="game-screen" class="hidden">
  <canvas id="game-canvas"></canvas>

  <!-- Touch Zones -->
  <div id="touch-zone-move" class="touch-zone touch-zone--left"></div>
  <div id="touch-zone-aim" class="touch-zone touch-zone--right"></div>

  <!-- Joysticks -->
  <div id="joystick-move" class="joystick"><div class="joystick-knob"></div></div>
  <div id="joystick-aim" class="joystick"><div class="joystick-knob"></div></div>

  <!-- Weapon Bar -->
  <div id="weapon-bar" class="weapon-bar"></div>

  <!-- Ability Button -->
  <button id="btn-ability" type="button" class="ability-btn" aria-label="Use ability">ABILITY</button>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="js/pixel-character.js"></script>
<script src="js/engine/camera.js"></script>
<script src="js/engine/input.js"></script>
<script src="js/engine/map.js"></script>
<script src="js/engine/touch-controls.js"></script>
<script src="js/entities/weapons.js"></script>
<script src="js/entities/classes.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/entities/projectile.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/combat.js"></script>
<script src="js/host-sim.js"></script>
<script src="js/client-sync.js"></script>
<script src="js/network.js"></script>
<script src="js/ability-input.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui-weapon-bar.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
