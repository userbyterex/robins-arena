<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robin's Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/hud.css" />
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<!-- ==================== LOBBY SCREEN ==================== -->
<div id="lobby-screen">
  <div class="lobby-container">

    <h1>🏹 ROBIN'S ARENA</h1>
    <p class="subtitle">Camp vs Castle · classes · conquest</p>

    <!-- Name Panel -->
    <div id="panel-name" class="scroll-panel" data-active="true">
      <div class="name-row">
        <input type="text" id="player-name" placeholder="Your callsign" maxlength="12" value="Robin" aria-label="Player callsign" autocomplete="off" autofocus />
      </div>
      <div class="button-row">
        <button id="btn-continue" class="btn-primary">Continue →</button>
      </div>
    </div>

    <!-- Choice Panel -->
    <div id="panel-choice" class="scroll-panel" data-active="false">
      <div class="button-row" style="flex-direction: column; width: 100%;">
        <button id="btn-host" class="btn-primary">🏕️ Create a camp</button>
        <button id="btn-join-open" class="btn-secondary">🔗 Join a camp</button>
      </div>
    </div>

    <!-- Join Panel -->
    <div id="panel-join" class="scroll-panel" data-active="false">
      <div class="flex-row">
        <button id="btn-refresh-camps" class="btn-secondary" style="flex:1;">↻ Refresh camps</button>
      </div>
      <ul id="camp-list" class="camp-list">
        <li class="empty">Scanning for camps…</li>
      </ul>
      <div class="or-divider">— Or enter a code —</div>
      <div class="flex-row">
        <input type="text" id="input-code" placeholder="CODE (4 letters)" maxlength="4" autocomplete="off" aria-label="Camp code" />
        <button id="btn-join-confirm" class="btn-primary">Join</button>
      </div>
      <button id="btn-join-back" class="btn-secondary back-btn">← Back</button>
    </div>

    <!-- Lobby Panel -->
    <div id="panel-lobby" class="scroll-panel" data-active="false">
      <h2>🏕️ Camp</h2>
      <p>Code: <strong id="room-code-display">----</strong></p>
      <p id="lobby-status">Waiting for players…</p>
      <ul id="player-roster"></ul>

      <div class="section-title">Choose your class</div>
      <div id="class-picker" class="class-grid">
        <!-- Populated by JS -->
      </div>
      <p class="class-hint">Pick your class · Ability: Space / Q</p>

      <div class="creator-panel">
        <div class="color-row">
          <label>Tunic</label>
          <div class="color-btn active" style="background:#c0392b;" data-color="tunic" data-val="#c0392b"></div>
          <div class="color-btn" style="background:#2980b9;" data-color="tunic" data-val="#2980b9"></div>
          <div class="color-btn" style="background:#27ae60;" data-color="tunic" data-val="#27ae60"></div>
          <div class="color-btn" style="background:#8e44ad;" data-color="tunic" data-val="#8e44ad"></div>
          <div class="color-btn" style="background:#d35400;" data-color="tunic" data-val="#d35400"></div>
          <div class="color-btn" style="background:#2c3e50;" data-color="tunic" data-val="#2c3e50"></div>
        </div>
        <div class="color-row">
          <label>Hood</label>
          <div class="color-btn active" style="background:#2c3e50;" data-color="hood" data-val="#2c3e50"></div>
          <div class="color-btn" style="background:#5d4037;" data-color="hood" data-val="#5d4037"></div>
          <div class="color-btn" style="background:#1a1a2e;" data-color="hood" data-val="#1a1a2e"></div>
          <div class="color-btn" style="background:#4a6741;" data-color="hood" data-val="#4a6741"></div>
          <div class="color-btn" style="background:#7f3e3e;" data-color="hood" data-val="#7f3e3e"></div>
          <div class="color-btn" style="background:#555;" data-color="hood" data-val="#555"></div>
        </div>
        <div class="preview-box">
          <canvas id="preview-canvas" width="64" height="64"></canvas>
        </div>
      </div>

      <div class="button-row">
        <button id="btn-start-game" class="btn-primary hidden">⚔️ Start hunt</button>
        <button id="btn-lobby-back" class="btn-secondary back-btn">← Leave</button>
      </div>
    </div>

  </div>
</div>

<!-- ==================== GAME SCREEN ==================== -->
<div id="game-screen" class="hidden">
  <div class="game-viewport">
    <canvas id="game-canvas" width="960" height="640"></canvas>
    <div id="touch-zone-move" class="touch-zone touch-zone--left"></div>
    <div id="touch-zone-aim" class="touch-zone touch-zone--right"></div>
    <div id="joystick-move" class="joystick"><div class="joystick-knob"></div></div>
    <div id="joystick-aim" class="joystick"><div class="joystick-knob"></div></div>
    <div id="weapon-bar" class="weapon-bar"></div>
    <button id="btn-ability" type="button" class="ability-btn" aria-label="Use ability">ABILITY</button>
  </div>
</div>

<!-- Scripts -->
<script src="js/engine/camera.js"></script>
<script src="js/engine/input.js"></script>
<script src="js/engine/map.js"></script>
<script src="js/engine/touch-controls.js"></script>
<script src="js/entities/weapons.js"></script>
<script src="js/entities/classes.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/entities/projectile.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/combat.js"></script>
<script src="js/host-sim.js"></script>
<script src="js/client-sync.js"></script>
<script src="js/network.js"></script>
<script src="js/ability-input.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui-weapon-bar.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
